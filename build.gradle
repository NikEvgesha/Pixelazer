plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.pixelazer'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

javafx {
    version = '17.0.16'
    modules = ['javafx.controls', 'javafx.swing']
}

application {
    mainClass = 'com.pixelazer.ui.PixelazerLauncher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def packagedAppDir = layout.buildDirectory.dir('package/Pixelazer')

tasks.register('packageApp', Exec) {
    dependsOn tasks.named('installDist')
    doFirst {
        delete(packagedAppDir)
        file(layout.buildDirectory.dir('package')).mkdirs()
    }
    commandLine "${System.getProperty('java.home')}/bin/jpackage",
            '--type', 'app-image',
            '--name', 'Pixelazer',
            '--app-version', project.version.toString(),
            '--vendor', 'Pixelazer',
            '--input', layout.buildDirectory.dir('install/pixelazer/lib').get().asFile,
            '--main-jar', "pixelazer-${project.version}.jar",
            '--main-class', application.mainClass.get(),
            '--dest', layout.buildDirectory.dir('package').get().asFile
}

tasks.register('packagePortable', Zip) {
    dependsOn tasks.named('packageApp')
    from(packagedAppDir)
    into('Pixelazer')
    archiveFileName = 'Pixelazer-portable.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
}
